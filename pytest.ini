# ============================================================
# pytest.ini — Pytest Configuration
# ============================================================
# This file tells pytest how to discover and run our tests.
# It lives at the project root so `pytest` works from anywhere.

[pytest]

# Where to look for tests
testpaths = tests

# Async mode: "auto" means pytest-asyncio automatically handles
# all async def test_ functions — no need for @pytest.mark.asyncio
# on every single test.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Verbose output by default — shows each test name + result
addopts =
    -v
    --tb=short
    --strict-markers

# Register custom markers (prevents "unknown marker" warnings)
markers =
    unit: Pure unit tests (no HTTP calls)
    integration: Tests that use the full HTTP stack via TestClient
    slow: Tests that take longer than usual
